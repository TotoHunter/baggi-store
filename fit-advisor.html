<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design Yours — VORTEX</title>
    <meta name="description" content="Describe your dream baggy jeans, hoodie or tee and send a one-off pre-order straight to VORTEX on WhatsApp.">
    <meta name="theme-color" content="#1a1a1e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23d3f85a'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css?v=8">
    <script src="js/config.js?v=8" defer></script>
    <script src="js/app.js?v=8" defer></script>
  </head>
  <body data-page="design">
    <div data-header></div>

    <main>
      <section class="page-section">
        <div class="container">
          <p class="eyebrow" data-bind="designEyebrow">AI-powered · Pre-order</p>
          <h1 class="page-title display"><span data-bind="designTitleTop">Design</span> <span class="accent" data-bind="designTitleBottom">yours.</span></h1>
          <p class="intro-text" data-bind="designText">Pick jeans, a hoodie or a shirt and describe the design in your head. We'll suggest a one-off pre-order made just for you.</p>

          <div class="design-grid">
            <div data-design-form></div>
            <aside class="design-preview" data-design-preview aria-live="polite">
              <p class="preview-label">Your personalised pre-order will show up here.</p>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <div data-footer></div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout — BAGGI</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23d3f85a'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css?v=12">
    <script src="js/config.js?v=12" defer></script>
    <script src="js/app.js?v=12" defer></script>
  </head>
  <body data-page="checkout">
    <div data-header></div>

    <main>
      <section class="page-section">
        <div class="container">
          <p class="eyebrow">Almost yours</p>
          <h1 class="page-title display">Checkout</h1>

          <div class="checkout-layout">
            <div>
              <form class="checkout-form" id="checkout-form">
                <h2 class="display checkout-section-title" data-step="01">Delivery details</h2>
                <div class="checkout-fields">
                  <label class="field"><span>Full name</span><input id="cust-name" name="name" required autocomplete="name"></label>
                  <label class="field"><span>Email</span><input id="cust-email" name="email" type="email" required autocomplete="email"></label>
                  <label class="field"><span>WhatsApp phone</span><input id="cust-phone" name="phone" required autocomplete="tel" placeholder="23480..."></label>
                  <label class="field"><span>Delivery address</span><input id="cust-address" name="address" required autocomplete="street-address"></label>
                  <label class="field"><span>City</span><input id="cust-city" name="city" required autocomplete="address-level2"></label>
                  <label class="field"><span>State</span><input id="cust-state" name="state" required autocomplete="address-level1" placeholder="Lagos"></label>
                  <label class="field"><span>Postcode</span><input id="cust-postcode" name="postcode" required autocomplete="postal-code" inputmode="numeric" placeholder="100001"></label>
                </div>

                <h2 class="display checkout-section-title" data-step="02">Payment method</h2>
                <div class="payment-methods" data-payment-methods></div>

                <div class="bank-details" data-bank-details></div>

                <button class="btn btn-primary checkout-submit" type="submit">Place order</button>
                <p class="form-hint">Payments are processed securely. Your supplier order is created after payment is confirmed.</p>
              </form>

              <div class="checkout-result" data-checkout-result hidden></div>
            </div>

            <aside class="cart-summary" data-checkout-summary></aside>
          </div>
        </div>
      </section>
    </main>

    <div data-footer></div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — BAGGI</title>
    <meta name="description" content="Get yours. Order BAGGI jeans, hoodies and tees on WhatsApp, or send your own design.">
    <meta name="theme-color" content="#1a1a1e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23d3f85a'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="contact">
    <div data-header></div>

    <main>
      <section class="page-section">
        <div class="container">
          <p class="eyebrow" data-bind="contactEyebrow">Get yours</p>
          <h1 class="page-title display"><span data-bind="contactTitleTop">Hit us</span> <span class="accent" data-bind="contactTitleBottom">up.</span></h1>
          <p class="intro-text" data-bind="contactText">Send your waist size and the wash you want. We'll confirm price and delivery.</p>
          <div class="contact-grid" data-contact-grid></div>
        </div>
      </section>
    </main>

    <div data-footer></div>
  </body>
</html>
